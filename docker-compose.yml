version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: PASSWORDD
      MYSQL_DATABASE: llmchat

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .

    container_name: backend

    depends_on:
      - mysql

    ports:
      - "8089:8089"

volumes:
  mysql_data:
